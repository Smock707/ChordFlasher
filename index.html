<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Flasher — Guitar Chord Practice Tool</title>
  <meta name="description" content="Free guitar practice tool. Flash random chords at any BPM, learn which chords belong in every key, and test yourself with a built-in quiz that tracks your progress. No sign-up required.">
  <meta name="theme-color" content="#0d0d14">
  <meta property="og:title"       content="Chord Flasher">
  <meta property="og:description" content="Practice switching guitar chords at any tempo. Includes chord diagrams, key modes, and a learn-as-you-go quiz for every major and minor key.">
  <meta property="og:type"        content="website">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #f0a500;
      --bg:     #0d0d14;
      --card:   #16161f;
      --card2:  #1a1a26;
      --border: #252535;
      --dim:    #555566;
    }

    body {
      background: var(--bg);
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    /* Prevent 300ms tap delay on interactive elements */
    button, input, select { touch-action: manipulation; }

    h1 {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.6rem;
      opacity: 0.85;
    }

    /* ── Tab switcher ── */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 2rem;
    }
    .tab-btn {
      padding: 7px 20px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--dim);
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .tab-btn:not(.active):hover { border-color: #3a3a50; color: #aaa; }

    /* ════════════════════════════════════
       PRACTICE TAB
    ════════════════════════════════════ */

    /* ── Card row (main + next) ── */
    .card-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-bottom: 1.6rem;
    }

    /* ── Chord card ── */
    .chord-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 28px;
      padding: 2.2rem 3.5rem 2rem;
      text-align: center;
      min-width: 300px;
      position: relative;
    }

    @keyframes cardFlash {
      0%   { border-color: var(--accent); box-shadow: 0 0 60px rgba(240,165,0,0.35), 0 0 0 1px rgba(240,165,0,0.2); }
      100% { border-color: var(--border); box-shadow: none; }
    }
    .chord-card.flash { animation: cardFlash 0.55s ease-out forwards; }

    @keyframes namePop {
      0%   { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .chord-name {
      font-size: clamp(3.6rem, 16vw, 5.2rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .chord-name.pop        { animation: namePop 0.18s ease-out forwards; }
    .chord-name.major      { color: #4dd9b8; }
    .chord-name.minor      { color: #8b8ffc; }
    .chord-name.diminished { color: #f87171; }

    .chord-type {
      margin-top: 0.5rem;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--dim);
    }
    .chord-degree {
      margin-top: 0.3rem;
      font-size: 0.82rem; font-weight: 500;
      color: var(--accent); min-height: 1.2em; opacity: 0.9;
    }
    .chord-diagram {
      margin-top: 1.4rem;
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 130px;
    }
    .chord-diagram svg text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Next-up tab ── */
    .next-tab {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 1rem 1.1rem;
      min-width: 100px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.35rem;
    }
    @keyframes nextFlash {
      0%   { border-color: rgba(240,165,0,0.55); box-shadow: 0 0 22px rgba(240,165,0,0.18); }
      100% { border-color: var(--border); box-shadow: none; }
    }
    .next-tab.flash { animation: nextFlash 0.5s ease-out forwards; }
    .next-label {
      font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim);
    }
    .next-name {
      font-size: 2.3rem; font-weight: 800;
      letter-spacing: -0.03em; line-height: 1; opacity: 0.65;
    }
    .next-name.major      { color: #4dd9b8; }
    .next-name.minor      { color: #8b8ffc; }
    .next-name.diminished { color: #f87171; }
    .next-type {
      font-size: 0.58rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim);
    }

    /* ── Beat dots ── */
    .beats {
      display: flex; align-items: center; gap: 14px; margin-bottom: 1.8rem;
    }
    .beat {
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--border);
      transition: background 0.04s, transform 0.04s, box-shadow 0.04s;
    }
    .beat.active { background: var(--accent); transform: scale(1.45); box-shadow: 0 0 10px rgba(240,165,0,0.75); }
    .beat.beat-one.active { background: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.85); }

    /* ── Controls panel ── */
    .panel {
      background: var(--card2);
      border: 1px solid var(--border); border-radius: 22px;
      padding: 1.4rem 1.5rem; width: 100%; max-width: 390px;
      display: flex; flex-direction: column; gap: 1.1rem;
    }
    .row { display: flex; align-items: center; gap: 12px; }
    .lbl {
      font-size: 0.67rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); min-width: 50px;
    }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 4px; background: var(--border);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent); cursor: pointer; transition: box-shadow 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { box-shadow: 0 0 0 7px rgba(240,165,0,0.18); }
    .bpm-val {
      font-size: 1.05rem; font-weight: 700;
      color: var(--accent); min-width: 44px; text-align: right;
    }
    .pills { display: flex; gap: 6px; flex: 1; }
    .pill {
      flex: 1; padding: 6px 0;
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; color: var(--dim);
      font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .pill:hover { border-color: #3a3a50; color: #999; }
    .pill.on { background: rgba(240,165,0,0.12); border-color: var(--accent); color: var(--accent); }
    select {
      flex: 1; background: transparent;
      border: 1px solid var(--border); border-radius: 8px;
      color: #e8e8f0; padding: 7px 10px; font-size: 0.9rem;
      outline: none; cursor: pointer; transition: border-color 0.15s;
    }
    select option { background: #1a1a26; }
    select:focus  { border-color: var(--accent); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 0.1rem 0; }
    .play-btn {
      width: 100%; padding: 13px; border: 2px solid transparent; border-radius: 12px;
      font-size: 0.92rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s;
    }
    .play-btn.stopped { background: var(--accent); color: #000; }
    .play-btn.stopped:hover { background: #ffba18; box-shadow: 0 6px 24px rgba(240,165,0,0.3); }
    .play-btn.running { background: transparent; border-color: var(--accent); color: var(--accent); }
    .play-btn.running:hover { background: rgba(240,165,0,0.07); }

    /* ════════════════════════════════════
       QUIZ TAB
    ════════════════════════════════════ */

    .quiz-panel {
      display: flex; flex-direction: column; align-items: stretch;
      gap: 1.2rem; width: 100%; max-width: 440px;
    }

    /* ── Home view ── */
    .q-intro {
      text-align: center; color: var(--dim);
      font-size: 0.8rem; line-height: 1.5; margin-bottom: 1rem;
    }
    .q-scope { display: flex; gap: 6px; width: 100%; margin-bottom: 1rem; }
    .q-scope-btn {
      flex: 1; padding: 8px 0;
      background: transparent; border: 1px solid var(--border);
      border-radius: 9px; color: var(--dim);
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s;
    }
    .q-scope-btn.on { background: rgba(240,165,0,0.12); border-color: var(--accent); color: var(--accent); }

    .q-activities { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.2rem; }
    .q-act-btn {
      text-align: left; cursor: pointer; width: 100%;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 1rem 1.2rem;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 0.9rem;
    }
    .q-act-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .q-act-num {
      flex: none; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(240,165,0,0.14); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.95rem;
    }
    .q-act-text { display: flex; flex-direction: column; gap: 2px; }
    .q-act-title { font-weight: 700; font-size: 0.95rem; color: #e8e8f0; }
    .q-act-desc  { font-size: 0.72rem; color: var(--dim); line-height: 1.35; }

    /* ── Stats card ── */
    .q-stats {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.1rem 1.2rem;
      display: flex; flex-direction: column; gap: 0.9rem;
    }
    .q-stats-title {
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim);
    }
    .q-stat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .q-stat-big { font-size: 1.8rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .q-stat-sub { font-size: 0.7rem; color: var(--dim); }
    .q-improve {
      font-size: 0.74rem; color: #e8e8f0;
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    }
    .q-improve .up   { color: #4dd9b8; font-weight: 700; }
    .q-improve .down { color: #f87171; font-weight: 700; }
    .q-spark { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
    .q-spark-bar { flex: 1; min-width: 3px; border-radius: 2px 2px 0 0; background: var(--accent); opacity: 0.8; }
    .q-peract { display: flex; gap: 8px; }
    .q-peract-cell {
      flex: 1; text-align: center; padding: 7px 4px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    }
    .q-peract-pct { font-size: 1rem; font-weight: 800; color: #e8e8f0; }
    .q-peract-lbl { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-top: 2px; }

    /* ── Question view ── */
    .q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .q-quit { background: transparent; border: none; color: var(--dim); font-size: 0.95rem; cursor: pointer; padding: 0 4px; line-height: 1; }
    .q-quit:hover { color: #f87171; }
    .q-progress { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); flex: 1; text-align: center; }
    .q-score { font-size: 0.7rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .q-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .q-bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }

    .q-card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 20px; padding: 1.4rem 1.3rem;
      display: flex; flex-direction: column; gap: 1.1rem;
    }
    .q-prompt { text-align: center; }
    .q-prompt-label { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.5rem; }
    .q-prompt-main { font-size: clamp(2.4rem, 11vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    .q-prompt-main.major { color: #4dd9b8; }
    .q-prompt-main.minor { color: #8b8ffc; }
    .q-prompt-sub { margin-top: 0.4rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }

    .q-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .q-keyopts { grid-template-columns: repeat(2, 1fr); }
    .q-opt {
      padding: 12px 6px; border-radius: 11px;
      border: 1.5px solid var(--border); background: transparent;
      color: #e8e8f0; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; transition: all 0.12s; text-align: center;
    }
    .q-keyopts .q-opt { font-size: 0.9rem; }
    .q-opt:hover:not(:disabled) { border-color: #3a3a50; }
    .q-opt.sel     { border-color: var(--accent); background: rgba(240,165,0,0.14); color: var(--accent); }
    .q-opt.correct { border-color: #4dd9b8; background: rgba(77,217,184,0.16); color: #4dd9b8; }
    .q-opt.wrong   { border-color: #f87171; background: rgba(248,113,113,0.16); color: #f87171; text-decoration: line-through; }
    .q-opt.missed  { border-color: #4dd9b8; border-style: dashed; color: #4dd9b8; }
    .q-opt:disabled { cursor: default; }

    .q-input {
      width: 100%; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 11px;
      color: #e8e8f0; padding: 12px 14px; font-size: 1rem;
      outline: none; transition: border-color 0.15s;
    }
    .q-input:focus { border-color: var(--accent); }
    .q-input:disabled { opacity: 0.7; }
    .q-hint { font-size: 0.66rem; color: var(--dim); text-align: center; margin-top: -0.5rem; }

    .q-action {
      width: 100%; padding: 13px; border: 2px solid transparent; border-radius: 12px;
      font-size: 0.86rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s;
      background: var(--accent); color: #000;
    }
    .q-action:hover { background: #ffba18; }
    .q-action.ghost { background: transparent; border-color: var(--accent); color: var(--accent); }
    .q-action.ghost:hover { background: rgba(240,165,0,0.08); }

    .q-feedback { border-radius: 12px; padding: 0.9rem 1rem; font-size: 0.82rem; line-height: 1.5; }
    .q-feedback.good { background: rgba(77,217,184,0.12); border: 1px solid rgba(77,217,184,0.4); color: #8ee9d2; }
    .q-feedback.bad  { background: rgba(248,113,113,0.10); border: 1px solid rgba(248,113,113,0.35); color: #f4a6a6; }
    .q-feedback b { color: #e8e8f0; }

    .q-btnrow { display: flex; gap: 8px; }
    .q-btnrow .q-action { flex: 1; }

    /* ── Complete view ── */
    .q-complete { text-align: center; display: flex; flex-direction: column; gap: 1.2rem; align-items: center; }
    .q-complete-big { font-size: 3.4rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .q-complete-sub { font-size: 0.85rem; color: var(--dim); }
    /* ════════════════════════════════════
       RESPONSIVE — MOBILE (≤ 540px)
    ════════════════════════════════════ */
    @media (max-width: 540px) {

      body {
        justify-content: flex-start;
        padding: 1.6rem 1rem 2rem;
      }

      /* ── Tabs ── */
      .tab-btn { padding: 10px 18px; font-size: 0.7rem; }

      /* ── Practice: stack card + next-tab vertically ── */
      .card-row { flex-direction: column; gap: 8px; }

      .chord-card {
        min-width: unset;
        width: 100%;
        padding: 1.6rem 1.5rem 1.4rem;
      }

      /* Next-tab becomes a compact horizontal strip */
      .next-tab {
        flex-direction: row;
        justify-content: center;
        min-width: unset;
        width: 100%;
        padding: 0.6rem 1.2rem;
        border-radius: 14px;
        gap: 0.5rem;
      }
      .next-name { font-size: 1.4rem; }
      .next-label { min-width: max-content; }
      .next-type  { display: none; } /* redundant on the strip */

      /* ── Beat dots — larger tap-friendly gap ── */
      .beats { gap: 16px; }
      .beat  { width: 13px; height: 13px; }

      /* ── Controls panel ── */
      .panel { max-width: 100%; }
      .pill  { padding: 10px 0; }  /* taller tap target */

      /* ── Quiz ── */
      .quiz-panel { max-width: 100%; }
      .q-options { gap: 6px; }
      .q-opt { padding: 13px 4px; font-size: 1rem; }
      .q-keyopts .q-opt { font-size: 0.82rem; }
      .q-card { padding: 1.2rem 1rem; }
    }

    /* ════════════════════════════════════
       RESPONSIVE — TABLET (541px–768px)
    ════════════════════════════════════ */
    @media (min-width: 541px) and (max-width: 768px) {
      .chord-card { padding: 2rem 2.5rem 1.8rem; }
      .panel      { max-width: 100%; }
      .quiz-panel { max-width: 100%; }
    }

  </style>
</head>
<body>

<h1>Chord Flasher</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="practice">Practice</button>
  <button class="tab-btn"        data-tab="quiz">Quiz</button>
</div>

<!-- ═══════════════ PRACTICE PANEL ═══════════════ -->
<div id="practicePanel">

  <div class="card-row">
    <div class="chord-card" id="card">
      <div class="chord-name" id="cname">—</div>
      <div class="chord-type" id="ctype">press start to begin</div>
      <div class="chord-degree" id="cdeg"></div>
      <div class="chord-diagram" id="diagram"></div>
    </div>
    <div class="next-tab" id="nextTab">
      <div class="next-label">Next</div>
      <div class="next-name" id="nextName">—</div>
      <div class="next-type" id="nextType"></div>
    </div>
  </div>

  <div class="beats">
    <div class="beat beat-one" id="b0"></div>
    <div class="beat"          id="b1"></div>
    <div class="beat"          id="b2"></div>
    <div class="beat"          id="b3"></div>
  </div>

  <div class="panel">
    <div class="row">
      <span class="lbl">BPM</span>
      <input type="range" id="bpmSlider" min="40" max="208" value="80">
      <span class="bpm-val" id="bpmVal">80</span>
    </div>
    <div class="row">
      <span class="lbl">Beats</span>
      <div class="pills" id="pillGroup">
        <button class="pill"    data-n="1">1</button>
        <button class="pill on" data-n="2">2</button>
        <button class="pill"    data-n="4">4</button>
        <button class="pill"    data-n="8">8</button>
      </div>
    </div>
    <hr class="divider">
    <div class="row">
      <span class="lbl">Key</span>
      <select id="keySelect">
        <option value="All">All Keys (random)</option>
        <optgroup label="── Major Keys ──">
          <option value="C">C Major</option>
          <option value="G">G Major</option>
          <option value="D">D Major</option>
          <option value="A">A Major</option>
          <option value="E">E Major</option>
          <option value="B">B Major</option>
          <option value="F#">F# Major</option>
          <option value="F">F Major</option>
          <option value="Bb">Bb Major</option>
          <option value="Eb">Eb Major</option>
          <option value="Ab">Ab Major</option>
          <option value="Db">Db Major</option>
        </optgroup>
        <optgroup label="── Minor Keys ──">
          <option value="Am">A Minor</option>
          <option value="Em">E Minor</option>
          <option value="Bm">B Minor</option>
          <option value="F#m">F# Minor</option>
          <option value="C#m">C# Minor</option>
          <option value="G#m">G# Minor</option>
          <option value="Dm">D Minor</option>
          <option value="Gm">G Minor</option>
          <option value="Cm">C Minor</option>
          <option value="Fm">F Minor</option>
          <option value="Bbm">Bb Minor</option>
          <option value="Ebm">Eb Minor</option>
        </optgroup>
      </select>
    </div>
    <button class="play-btn stopped" id="playBtn">Start</button>
  </div>

</div><!-- /practicePanel -->

<!-- ═══════════════ QUIZ PANEL ═══════════════ -->
<div id="quizPanel" style="display:none">
  <div class="quiz-panel">

    <!-- HOME -->
    <div id="quizHome">
      <p class="q-intro">Pick an activity. Each round is 10 questions with instant feedback — your scores are saved so you can watch yourself improve over time.</p>

      <div class="q-scope" id="qScope">
        <button class="q-scope-btn"    data-scope="major">Major</button>

  'G#m':[{n:'G#m',t:'minor',d:'i'},  {n:'B',   t:'major',d:'III'},{n:'C#m', t:'minor',d:'iv'}, {n:'D#m', t:'minor',d:'v'},  {n:'E',   t:'major',d:'VI'}, {n:'F#',  t:'major',d:'VII'}],

  Cm:  [{n:'Cm',  t:'minor',d:'i'},  {n:'Eb',  t:'major',d:'III'},{n:'Fm',  t:'minor',d:'iv'}, {n:'Gm',  t:'minor',d:'v'},  {n:'Ab',  t:'major',d:'VI'}, {n:'Bb',  t:'major',d:'VII'}],
  Fm:  [{n:'Fm',  t:'minor',d:'i'},  {n:'Ab',  t:'major',d:'III'},{n:'Bbm', t:'minor',d:'iv'}, {n:'Cm',  t:'minor',d:'v'},  {n:'Db',  t:'major',d:'VI'}, {n:'Eb',  t:'major',d:'VII'}],

const MAJOR_KEYS = ['C','G','D','A','E','B','F#','F','Bb','Eb','Ab','Db'];
const MINOR_KEYS = ['Am','Em','Bm','F#m','C#m','G#m','Dm','Gm','Cm','Fm','Bbm','Ebm'];

const ALL_POOL = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'].flatMap(r => [
  { n: r,       t: 'major', d: '' },

]);

const FNG = {
  'C':   {s:[-1,3,2,0,1,0],  b:1, bar:null},
  'D':   {s:[-1,-1,0,2,3,2], b:1, bar:null},
  'E':   {s:[0,2,2,1,0,0],   b:1, bar:null},
  'F':   {s:[1,3,3,2,1,1],   b:1, bar:[1,0,5]},
  'G':   {s:[3,2,0,0,0,3],   b:1, bar:null},
  'A':   {s:[-1,0,2,2,2,0],  b:1, bar:null},

  'Bb':  {s:[-1,1,3,3,3,1],  b:1, bar:[1,1,5]},
  'Eb':  {s:[-1,6,8,8,8,6],  b:6, bar:[6,1,5]},

  'Gb':  {s:[2,4,4,3,2,2],   b:2, bar:[2,0,5]},
  'C#':  {s:[-1,4,6,6,6,4],  b:4, bar:[4,1,5]},
  'Cb':  {s:[-1,2,4,4,4,2],  b:2, bar:[2,1,5]},

  'Em':  {s:[0,2,2,0,0,0],   b:1, bar:null},

  'Gm':  {s:[3,5,5,3,3,3],   b:3, bar:[3,0,5]},

  'Bbm': {s:[-1,1,3,3,2,1],  b:1, bar:[1,1,5]},
};

function chordSVG(name) {
  const data = FNG[name];
  if (!data) return '';
  const {s, b, bar} = data;
  const W = 130, H = 135;
  const tPad = 28, lPad = 22, rPad = 12, bPad = 8;
  const gW = (W - lPad - rPad) / 5;
  const gH = (H - tPad - bPad) / 4;
  const sx  = i => lPad + i * gW;
  const fy  = f => tPad + (f - b + 0.5) * gH;
  const DOT = gH * 0.30;
  let o = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  if (b === 1) {
    o += `<line x1="${lPad}" y1="${tPad}" x2="${W-rPad}" y2="${tPad}" stroke="#c8c8e0" stroke-width="3.5" stroke-linecap="round"/>`;
  } else {
    o += `<line x1="${lPad}" y1="${tPad}" x2="${W-rPad}" y2="${tPad}" stroke="#404055" stroke-width="1.5"/>`;
    o += `<text x="${lPad-4}" y="${tPad + gH*0.5 + 4}" text-anchor="end" fill="#f0a500" font-size="10" font-weight="bold">${b}fr</text>`;
  }
  for (let f = 1; f <= 4; f++) {
    const y = tPad + f * gH;
    o += `<line x1="${lPad}" y1="${y}" x2="${W-rPad}" y2="${y}" stroke="#303045" stroke-width="1"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const x = sx(i);
    o += `<line x1="${x}" y1="${tPad}" x2="${x}" y2="${tPad + 4*gH}" stroke="#353550" stroke-width="1"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const x = sx(i), y = tPad - 10;
    if (s[i] === -1) {
      o += `<text x="${x}" y="${y+5}" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">✕</text>`;
    } else if (s[i] === 0) {
      o += `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#4dd9b8" stroke-width="1.5"/>`;
    }
  }
  if (bar) {
    const [bf, bFrom, bTo] = bar;
    const cy = fy(bf);
    o += `<rect x="${sx(bFrom)}" y="${cy-DOT}" width="${sx(bTo)-sx(bFrom)}" height="${DOT*2}" rx="${DOT}" fill="#f0a500"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const f = s[i];
    if (f <= 0) continue;
    if (bar && f === bar[0] && i >= bar[1] && i <= bar[2]) continue;
    o += `<circle cx="${sx(i)}" cy="${fy(f)}" r="${DOT}" fill="#f0a500"/>`;
  }
  o += '</svg>';
  return o;
}

let running = false, bpm = 80, beatsPerChord = 2, beat = 0;
let timerId = null, practiceKey = 'All';
let currChord = null, upNext = null;

const card     = document.getElementById('card');
const cname    = document.getElementById('cname');
const ctype    = document.getElementById('ctype');
const cdeg     = document.getElementById('cdeg');
const diagram  = document.getElementById('diagram');
const nextTab  = document.getElementById('nextTab');
const nextName = document.getElementById('nextName');
const nextType = document.getElementById('nextType');
const dots     = [0,1,2,3].map(i => document.getElementById('b' + i));
const playBtn  = document.getElementById('playBtn');

function getPool() { return practiceKey === 'All' ? ALL_POOL : (KEYS[practiceKey] || ALL_POOL); }

function pickFrom(excluding) {
  const p = getPool();
  let c;
  do { c = p[Math.floor(Math.random() * p.length)]; }
  while (p.length > 1 && c.n === excluding?.n);
  return c;
}

function showChord(chord) {
  cname.textContent = chord.n;
  cname.className   = 'chord-name ' + chord.t;
  ctype.textContent = chord.t;
  const keyLabel = practiceKey !== 'All'
    ? practiceKey + (practiceKey.endsWith('m') ? ' minor' : ' major') : '';
  cdeg.textContent = (chord.d && practiceKey !== 'All') ? chord.d + '  ·  ' + keyLabel : '';
  diagram.innerHTML = chordSVG(chord.n);
  card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  cname.classList.remove('pop'); void cname.offsetWidth; cname.classList.add('pop');
}

function showNext(chord) {
  nextName.textContent = chord.n;
  nextName.className   = 'next-name ' + chord.t;
  nextType.textContent = chord.t;
  nextTab.classList.remove('flash'); void nextTab.offsetWidth; nextTab.classList.add('flash');
}

function advance() {
  currChord = upNext ?? pickFrom(null);
  upNext    = pickFrom(currChord);
  showChord(currChord);
  showNext(upNext);
}

function tick() {
  dots.forEach((d, i) => d.classList.toggle('active', i === (beat % 4)));
  if (beat % beatsPerChord === 0) advance();
  beat++;
}

function startMetronome() {
  running = true; beat = 0; currChord = null; upNext = null;
  playBtn.textContent = 'Stop'; playBtn.className = 'play-btn running';
  tick();
  timerId = setInterval(tick, 60000 / bpm);
}

function stopMetronome() {
  running = false; clearInterval(timerId); timerId = null;
  playBtn.textContent = 'Start'; playBtn.className = 'play-btn stopped';
  dots.forEach(d => d.classList.remove('active'));
  cname.textContent = '—'; cname.className = 'chord-name';
  ctype.textContent = 'press start to begin'; cdeg.textContent = '';
  diagram.innerHTML = '';
  nextName.textContent = '—'; nextName.className = 'next-name'; nextType.textContent = '';
}

function reschedule() { clearInterval(timerId); timerId = setInterval(tick, 60000 / bpm); }

playBtn.addEventListener('click', () => running ? stopMetronome() : startMetronome());

document.getElementById('bpmSlider').addEventListener('input', e => {
  bpm = +e.target.value;
  document.getElementById('bpmVal').textContent = bpm;
  if (running) reschedule();
});

document.getElementById('keySelect').addEventListener('change', e => {
  practiceKey = e.target.value; upNext = null;
});

document.getElementById('pillGroup').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  beatsPerChord = +btn.dataset.n;
});

// Pitch-class map for enharmonic-safe chord comparison
const PITCH = {
  'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,
  'E#':5,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,
  'Bb':10,'B':11,'Cb':11,
};

// Normalize any chord spelling to "pitchClass:quality" (e.g. "Gb" -> "6:major")
function chordId(name) {
  const m = String(name).trim().match(/^([A-Ga-g])([#b]?)(.*)$/);
  if (!m) return null;
  const root = m[1].toUpperCase() + (m[2] || '');
  const p = PITCH[root];
  if (p === undefined) return null;
  const rest = m[3].toLowerCase().replace(/\s+/g, '');
  let q = 'major';
  if (rest.startsWith('maj')) q = 'major';
  else if (rest[0] === 'm') q = 'minor';
  return p + ':' + q;
}

// Canonical display names (one spelling per pitch+quality) for distractors
const CANON_CHORDS = [
  {n:'C',t:'major'},{n:'Cm',t:'minor'},  {n:'Db',t:'major'},{n:'C#m',t:'minor'},
  {n:'D',t:'major'},{n:'Dm',t:'minor'},  {n:'Eb',t:'major'},{n:'Ebm',t:'minor'},
  {n:'E',t:'major'},{n:'Em',t:'minor'},  {n:'F',t:'major'}, {n:'Fm',t:'minor'},
  {n:'F#',t:'major'},{n:'F#m',t:'minor'},{n:'G',t:'major'}, {n:'Gm',t:'minor'},
  {n:'Ab',t:'major'},{n:'G#m',t:'minor'},{n:'A',t:'major'}, {n:'Am',t:'minor'},
  {n:'Bb',t:'major'},{n:'Bbm',t:'minor'},{n:'B',t:'major'}, {n:'Bm',t:'minor'},
];

const ALL_KEYS = [...MAJOR_KEYS, ...MINOR_KEYS];

function keyLabel(k) {
  const isMin = k.endsWith('m');
  return (isMin ? k.slice(0, -1) : k) + (isMin ? ' minor' : ' major');
}
function keyIdSet(k) { return new Set(KEYS[k].map(c => chordId(c.n))); }
function keysForChordId(cid, pool) { return pool.filter(k => KEYS[k].some(c => chordId(c.n) === cid)); }

function qShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(arr, n) { return qShuffle([...arr]).slice(0, n); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ── Persistent stats (localStorage) ──
const QSTATS_KEY = 'cf_quiz_stats';
function loadStats() {
  try { return JSON.parse(localStorage.getItem(QSTATS_KEY)) || {blocks: []}; }
  catch (e) { return {blocks: []}; }
}
function saveStats(s) { try { localStorage.setItem(QSTATS_KEY, JSON.stringify(s)); } catch (e) {} }
function recordBlock(activity, correct, total) {
  const s = loadStats();
  s.blocks.push({a: activity, c: correct, n: total, t: Date.now()});
  if (s.blocks.length > 300) s.blocks = s.blocks.slice(-300);
  saveStats(s);
  return s;
}

const ACT_NAMES = {1: 'Chords in a Key', 2: 'Keys for a Chord', 3: 'Type the Key'};

const elComplete = document.getElementById('quizComplete');

function scopeKeys() {
  return quiz.scope === 'major' ? MAJOR_KEYS
       : quiz.scope === 'minor' ? MINOR_KEYS
       : ALL_KEYS;
}

// ── Question generators ──
function genA1() {
  const key = pick(scopeKeys());
  const ids = keyIdSet(key);
  const correct  = KEYS[key].map(c => ({name: c.n, correct: true}));
  const distract = sample(CANON_CHORDS.filter(c => !ids.has(chordId(c.n))), 4)
                     .map(c => ({name: c.n, correct: false}));
  return {type: 1, key, options: qShuffle([...correct, ...distract]), selected: new Set()};
}

function genA2() {
  const chord = pick(CANON_CHORDS);
  const cid   = chordId(chord.n);
  const pool  = scopeKeys();
  const correctKeys  = keysForChordId(cid, pool);
  const distractKeys = sample(pool.filter(k => !correctKeys.includes(k)), quiz.scope === 'all' ? 6 : 5);
  const options = qShuffle([
    ...correctKeys.map(k => ({key: k, correct: true})),
    ...distractKeys.map(k => ({key: k, correct: false})),
  ]);
  return {type: 2, chord, options, selected: new Set()};
}

function genA3() {
  const key = pick(scopeKeys());
  return {type: 3, key, answerIds: keyIdSet(key), answerNames: KEYS[key].map(c => c.n)};
}

function genQuestion() {
  return quiz.activity === 1 ? genA1() : quiz.activity === 2 ? genA2() : genA3();
}

// ── Block flow ──
function startBlock(activity) {
  quiz.activity = activity;
  quiz.qIndex = 0;
  quiz.correctCount = 0;
  elHome.style.display = 'none';
  elComplete.style.display = 'none';
  elQuestion.style.display = '';
  nextQuestion();
}

function nextQuestion() {
  quiz.q = genQuestion();
  quiz.answered = false;
  qProgress.textContent = `Question ${quiz.qIndex + 1} / ${quiz.total}`;
  qScore.textContent = `${quiz.correctCount} correct`;
  qBarFill.style.width = (quiz.qIndex / quiz.total * 100) + '%';
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.q;
  if (q.type === 1) {
    const isMin = q.key.endsWith('m');
    qCard.innerHTML = `
      <div class="q-prompt">
        <div class="q-prompt-label">Which chords are in</div>
        <div class="q-prompt-main">${isMin ? q.key.slice(0, -1) : q.key}</div>
        <div class="q-prompt-sub">${isMin ? 'minor' : 'major'} key</div>
      </div>
      <div class="q-options" id="qOpts"></div>
      <div id="qFeedback"></div>
      <button class="q-action" id="qSubmit">Check answer</button>`;
    buildToggles(q.options.map(o => o.name));
    qCard.querySelector('#qSubmit').onclick = gradeMulti;

  } else if (q.type === 2) {
    qCard.innerHTML = `
      <div class="q-prompt">
        <div class="q-prompt-label">Which keys contain</div>
        <div class="q-prompt-main ${q.chord.t}">${q.chord.n}</div>
        <div class="q-prompt-sub">${q.chord.t}</div>
      </div>
      <div class="q-options q-keyopts" id="qOpts"></div>
      <div id="qFeedback"></div>
      <button class="q-action" id="qSubmit">Check answer</button>`;
    buildToggles(q.options.map(o => keyLabel(o.key)));
    qCard.querySelector('#qSubmit').onclick = gradeMulti;

  } else {
    const isMin = q.key.endsWith('m');
    qCard.innerHTML = `
      <div class="q-prompt">
        <div class="q-prompt-label">Type the six chords in</div>
        <div class="q-prompt-main">${isMin ? q.key.slice(0, -1) : q.key}</div>
        <div class="q-prompt-sub">${isMin ? 'minor' : 'major'} key</div>
      </div>
      <input class="q-input" id="qInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="e.g. C  Dm  Em  F  G  Am">
      <div class="q-hint">Separate chords with spaces or commas</div>
      <div id="qFeedback"></div>
      <button class="q-action" id="qSubmit">Check answer</button>`;
    const input = qCard.querySelector('#qInput');
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !quiz.answered) { e.preventDefault(); gradeA3(); }
    });
    input.focus();
    qCard.querySelector('#qSubmit').onclick = gradeA3;
  }
}

function buildToggles(labels) {
  const wrap = qCard.querySelector('#qOpts');
  labels.forEach((label, i) => {
    const b = document.createElement('button');
    b.className = 'q-opt';
    b.textContent = label;
    b.dataset.i = i;
    b.onclick = () => {
      if (quiz.answered) return;
      if (quiz.q.selected.has(i)) { quiz.q.selected.delete(i); b.classList.remove('sel'); }
      else { quiz.q.selected.add(i); b.classList.add('sel'); }
    };
    wrap.appendChild(b);
  });
}

function gradeMulti() {
  const q = quiz.q;
  const correctIdx = new Set(q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0));
  const ok = q.selected.size === correctIdx.size && [...q.selected].every(i => correctIdx.has(i));

  qCard.querySelectorAll('.q-opt').forEach(b => {
    const i = +b.dataset.i;
    b.disabled = true;
    b.classList.remove('sel');
    const isCorrect = correctIdx.has(i), isSel = q.selected.has(i);
    if (isCorrect && isSel) b.classList.add('correct');
    else if (!isCorrect && isSel) b.classList.add('wrong');
    else if (isCorrect && !isSel) b.classList.add('missed');
  });

  let fb;
  if (q.type === 1) {
    const names = q.options.filter(o => o.correct).map(o => o.name);
    fb = `The chords in <b>${keyLabel(q.key)}</b> are <b>${names.join(', ')}</b>.`;
  } else {
    const labels = q.options.filter(o => o.correct).map(o => keyLabel(o.key));
    fb = `<b>${q.chord.n}</b> is found in <b>${labels.join(', ')}</b>.`;
  }
  finishQuestion(ok, fb);
}

function gradeA3() {
  const q = quiz.q;
  const input = qCard.querySelector('#qInput');
  const entered = new Set();
  input.value.split(/[\s,]+/).filter(Boolean).forEach(tok => {
    const id = chordId(tok);
    if (id) entered.add(id);
  });
  const ok = entered.size === q.answerIds.size && [...q.answerIds].every(id => entered.has(id));
  input.disabled = true;
  finishQuestion(ok, `The chords in <b>${keyLabel(q.key)}</b> are <b>${q.answerNames.join(', ')}</b>.`);
}

function finishQuestion(ok, feedbackHtml) {
  quiz.answered = true;
  if (ok) { quiz.correctCount++; qScore.textContent = `${quiz.correctCount} correct`; }
  const fb = qCard.querySelector('#qFeedback');
  fb.className = 'q-feedback ' + (ok ? 'good' : 'bad');
  fb.innerHTML = (ok ? '✓ Correct! ' : '✗ Not quite. ') + feedbackHtml;

  const submit = qCard.querySelector('#qSubmit');
  submit.textContent = (quiz.qIndex + 1 < quiz.total) ? 'Next question' : 'See results';
  submit.classList.add('ghost');
  submit.onclick = () => {
    quiz.qIndex++;
    if (quiz.qIndex >= quiz.total) finishBlock();
    else nextQuestion();
  };
}

function finishBlock() {
  recordBlock(quiz.activity, quiz.correctCount, quiz.total);
  elQuestion.style.display = 'none';
  elComplete.style.display = '';
  const pct = Math.round(quiz.correctCount / quiz.total * 100);
  document.getElementById('qcPct').textContent = pct + '%';
  document.getElementById('qcSub').textContent =
    `${quiz.correctCount} of ${quiz.total} correct · ${ACT_NAMES[quiz.activity]}`;
  renderStats(document.getElementById('qcStats'));
}

// ── Stats rendering ──
function renderStats(el) {
  const blocks = loadStats().blocks;
  if (!blocks.length) {
    el.innerHTML = `<div class="q-stats-title">Your progress</div>
      <div class="q-stat-sub">No rounds yet — finish a round to start tracking your improvement.</div>`;
    return;
  }
  const totC = blocks.reduce((a, b) => a + b.c, 0);
  const totN = blocks.reduce((a, b) => a + b.n, 0);
  const overall = Math.round(totC / totN * 100);

  const per = [1, 2, 3].map(a => {
    const bs = blocks.filter(b => b.a === a);
    const c = bs.reduce((x, b) => x + b.c, 0), n = bs.reduce((x, b) => x + b.n, 0);
    return {a, pct: n ? Math.round(c / n * 100) : null};
  });

  const firstPct = Math.round(blocks[0].c / blocks[0].n * 100);
  const lastPct  = Math.round(blocks[blocks.length - 1].c / blocks[blocks.length - 1].n * 100);
  const diff = lastPct - firstPct;

  const spark = blocks.slice(-24).map(b => Math.round(b.c / b.n * 100));
  const sparkHtml = spark.map(p => `<div class="q-spark-bar" style="height:${Math.max(6, p)}%"></div>`).join('');

  let improveHtml = '';
  if (blocks.length >= 2) {
    const arrow = diff > 0 ? `<span class="up">▲ ${diff}%</span>`
                : diff < 0 ? `<span class="down">▼ ${-diff}%</span>`
                : `<span>holding steady</span>`;
    improveHtml = `<div class="q-improve">First round <b>${firstPct}%</b> → latest <b>${lastPct}%</b> ${arrow}</div>`;
  }

  el.innerHTML = `
    <div class="q-stats-title">Your progress</div>
    <div class="q-stat-row">
      <div><div class="q-stat-big">${overall}%</div><div class="q-stat-sub">overall accuracy</div></div>
      <div class="q-stat-sub">${blocks.length} round${blocks.length > 1 ? 's' : ''}<br>${totN} questions</div>
    </div>
    ${improveHtml}
    <div class="q-spark">${sparkHtml}</div>
    <div class="q-peract">
      ${per.map(p => `<div class="q-peract-cell"><div class="q-peract-pct">${p.pct === null ? '—' : p.pct + '%'}</div><div class="q-peract-lbl">Act ${p.a}</div></div>`).join('')}
    </div>`;
}

function quizGoHome() {
  elQuestion.style.display = 'none';
  elComplete.style.display = 'none';
  elHome.style.display = '';
  renderStats(document.getElementById('qStats'));
}

// ── Quiz events ──
document.getElementById('qScope').addEventListener('click', e => {
  const b = e.target.closest('.q-scope-btn');
  if (!b) return;
  quiz.scope = b.dataset.scope;
  document.querySelectorAll('.q-scope-btn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
});
document.querySelectorAll('.q-act-btn').forEach(b => {
  b.addEventListener('click', () => startBlock(+b.dataset.act));
});
document.getElementById('qQuit').addEventListener('click', quizGoHome);
document.getElementById('qcHome').addEventListener('click', quizGoHome);
document.getElementById('qcAgain').addEventListener('click', () => startBlock(quiz.activity));

// Init home stats
renderStats(document.getElementById('qStats'));

// ══════════════════════════════════════════════════
// TAB SWITCHING
// ══════════════════════════════════════════════════

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('practicePanel').style.display = target === 'practice' ? '' : 'none';
    document.getElementById('quizPanel').style.display     = target === 'quiz'     ? '' : 'none';
    // Stop metronome when leaving practice tab
    if (target !== 'practice' && running) stopMetronome();
    // Reset quiz to home view when entering
    if (target === 'quiz') quizGoHome();
  });
});
</script>
